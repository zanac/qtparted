name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
            qt6-base-dev libparted-dev libblkid-dev parted \
            e2fsprogs dosfstools mtools ntfs-3g f2fs-tools util-linux

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -R model

      - name: Disk tests (image files and loop devices, as root)
        run: sudo ./build/tests/tst_disk
